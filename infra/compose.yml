services:
  catalog-db:
    image: postgres:16-alpine

    environment:
      POSTGRES_DB: catalog
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog

    ports:
      - "5433:5432"

    volumes:
      - catalog-db-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog -d catalog"]
      interval: 5s
      timeout: 5s
      retries: 10
  
  catalog-service:
    build:
      context: ../catalog-service

    environment:
      DATABASE_URL: postgresql+psycopg2://catalog:catalog@catalog-db:5432/catalog

    ports:
      - "8001:8000"

    depends_on:
      catalog-db:
        condition: service_healthy


  auth-db:
    image: postgres:16-alpine

    environment:
      POSTGRES_DB: auth
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth

    ports:
      - "5436:5432"

    volumes:
      - auth-db-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d auth"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    build:
      context: ../auth-service

    env_file:
      - ../auth-service/.env

    environment:
      DATABASE_URL: postgresql+psycopg2://auth:auth@auth-db:5432/auth

    ports:
      - "8004:8000"

    depends_on:
      auth-db:
        condition: service_healthy

  order-db:
    image: postgres:16-alpine

    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders

    ports:
      - "5434:5432"

    volumes:
      - order-db-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders"]
      interval: 5s
      timeout: 5s
      retries: 10

  payment-db:
    image: postgres:16-alpine

    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments

    ports:
      - "5435:5432"

    volumes:
      - payment-db-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d payments"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine

    environment:
      RABBITMQ_DEFAULT_USER: orderflow
      RABBITMQ_DEFAULT_PASS: orderflow

    ports:
      - "5672:5672"
      - "15672:15672"

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:4.3.1

    ports:
      - "127.0.0.1:9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:29092,PLAINTEXT_HOST://:9092

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data

    volumes:
      - kafka-data:/var/lib/kafka/data

    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list
      interval: 5s
      timeout: 10s
      retries: 10

  mongodb:
    image: mongo:8.0

    environment:
      MONGO_INITDB_ROOT_USERNAME: analytics
      MONGO_INITDB_ROOT_PASSWORD: analytics

    ports:
      - "127.0.0.1:27017:27017"

    volumes:
      - mongodb-data:/data/db

    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --username
        - analytics
        - --password
        - analytics
        - --authenticationDatabase
        - admin
        - --eval
        - "db.adminCommand('ping').ok"
      interval: 5s
      timeout: 5s
      retries: 10

  payment-service:
    build:
      context: ../payment-service

    environment:
      DATABASE_URL: postgresql+asyncpg://payments:payments@payment-db:5432/payments

      RABBITMQ_URL: amqp://orderflow:orderflow@rabbitmq:5672/
      PAYMENT_EXCHANGE_NAME: payment.events
      PAYMENT_SUCCEEDED_ROUTING_KEY: payment.succeeded

      KAFKA_BOOTSTRAP_SERVER: kafka:29092
      KAFKA_ANALYTIC_PAYMENT_TOPIC: payment-events

    ports:
      - "8003:8000"

    depends_on:
      payment-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_healthy

  order-service:
    build:
      context: ../order-service

    environment:
      DATABASE_URL: postgresql+psycopg2://orders:orders@order-db:5432/orders

      CATALOG_SERVICE_URL: http://catalog-service:8000
      PAYMENT_SERVICE_URL: http://payment-service:8000

      RABBITMQ_URL: amqp://orderflow:orderflow@rabbitmq:5672/
      PAYMENT_EXCHANGE_NAME: payment.events
      PAYMENT_QUEUE_NAME: payment.results
      PAYMENT_SUCCEEDED_ROUTING_KEY: payment.succeeded

    ports:
      - "8002:8000"

    depends_on:
      order-db:
        condition: service_healthy
      catalog-service:
        condition: service_started
      payment-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  analytic-service:
    build:
      context: ../analytic-service

    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: payment-events

      MONGODB_URL: mongodb://analytics:analytics@mongodb:27017/
      MONGODB_DATABASE: analytics
      MONGODB_COLLECTION: events

    ports:
      - "8005:8000"

    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy

  api-gateway:
    build:
      context: ../api-gateway

    env_file:
      - ../api-gateway/.env

    environment:
      CATALOG_SERVICE_URL: http://catalog-service:8000
      ORDER_SERVICE_URL: http://order-service:8000
      AUTH_SERVICE_URL: http://auth-service:8000

    ports:
      - "8000:8000"

    depends_on:
      catalog-service:
        condition: service_started
      order-service:
        condition: service_started
      auth-service:
        condition: service_started


volumes:
  catalog-db-data:
  auth-db-data:
  order-db-data:
  payment-db-data:
  kafka-data:
  mongodb-data:
  